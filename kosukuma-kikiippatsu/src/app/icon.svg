<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- こすくまくん危機一髪 favicon: 紺の宇宙 + クリーム色のくま + 小さな剣 -->
  <circle cx="32" cy="32" r="32" fill="#0a0e2a"/>
  <!-- 星 -->
  <circle cx="10" cy="16" r="1.6" fill="#ffd93d"/>
  <circle cx="54" cy="44" r="1.3" fill="#fffef2"/>
  <circle cx="14" cy="46" r="1.1" fill="#ffb3c7"/>
  <!-- 耳 -->
  <circle cx="19" cy="22" r="7" fill="#fdf7c1"/>
  <circle cx="45" cy="22" r="7" fill="#fdf7c1"/>
  <circle cx="19" cy="22" r="3.2" fill="#ffb3c7"/>
  <circle cx="45" cy="22" r="3.2" fill="#ffb3c7"/>
  <!-- 顔 -->
  <circle cx="32" cy="36" r="17" fill="#fdf7c1"/>
  <!-- 目 -->
  <circle cx="25.5" cy="34.5" r="2.1" fill="#3a3730"/>
  <circle cx="38.5" cy="34.5" r="2.1" fill="#3a3730"/>
  <!-- 鼻と口 -->
  <ellipse cx="32" cy="40" rx="2.8" ry="2.1" fill="#3a3730"/>
  <path d="M32 42.2q0 2.8-3 3.4M32 42.2q0 2.8 3 3.4" stroke="#3a3730" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- ほっぺ -->
  <circle cx="20.5" cy="41" r="2.6" fill="#ffb3c7"/>
  <circle cx="43.5" cy="41" r="2.6" fill="#ffb3c7"/>
  <!-- 小さな剣(右上にななめ) -->
  <g transform="rotate(35 51 12)">
    <rect x="49.7" y="1" width="2.6" height="12.4" rx="1.3" fill="#e8ecf8"/>
    <rect x="46.4" y="12.2" width="9.2" height="2.6" rx="1.3" fill="#ffd93d"/>
    <rect x="49.9" y="14.6" width="2.2" height="5" rx="1.1" fill="#ff6b6b"/>
  </g>
</svg>
